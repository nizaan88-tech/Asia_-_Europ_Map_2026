<!DOCTYPE html>
<html lang="ta"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ஊடாடும் உலக வரைபடம்</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--ink:#1e1b4b;--sea:#38bdf8;--land:#4ade80;--city:#f97316;--sel:#7c3aed;--canal:#0369a1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit}
html,body{height:100%;margin:0}
body{font-family:"Noto Sans Tamil","Latha","Nirmala UI",system-ui,sans-serif;background:#1e1b4b;color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
header{background:linear-gradient(120deg,#312e81,#0e7490 70%,#059669);color:#fff;padding:10px clamp(10px,2vw,24px);display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;box-shadow:0 3px 14px #0006;z-index:5}
h1{font-size:clamp(16px,2.3vw,28px);margin:0;font-weight:800;flex:1 1 220px;line-height:1.3}
h1 small{display:block;font-size:.55em;font-weight:400;opacity:.85}
.sel{flex:1 1 260px;max-width:460px}
select{width:100%;font:600 clamp(15px,1.6vw,20px) inherit;font-family:inherit;padding:10px 12px;border-radius:12px;border:2px solid #fff8;background:#fff;color:var(--ink);min-height:44px}
nav{display:flex;gap:6px;flex:1 1 100%;overflow-x:auto}
nav button{flex:1 1 0;min-width:max-content;min-height:44px;font:600 clamp(13px,1.5vw,18px) inherit;font-family:inherit;border:0;border-radius:12px 12px 0 0;padding:8px 14px;background:#ffffff26;color:#fff;cursor:pointer}
nav button[aria-selected=true]{background:#fff;color:#312e81}
main{flex:1;position:relative;min-height:0;background:radial-gradient(circle at 30% 20%,#e0f2fe,#bae6fd 70%)}
svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;display:block}
svg:active{cursor:grabbing}
.poly{vector-effect:non-scaling-stroke;stroke-width:1.5;cursor:pointer;transition:fill .2s}
.sea .poly{fill:rgba(125,200,255,.5);stroke:#0ea5e9}
.country .poly{fill:rgba(134,239,172,.5);stroke:#16a34a}
.sel .poly{stroke-width:2.5}
.rip{fill:none;vector-effect:non-scaling-stroke;pointer-events:none;stroke-linejoin:round;animation:rip 2.8s ease-out infinite;opacity:0}
.sea .rip{stroke:#38bdf8}.country .rip{stroke:#22c55e}
.rip.b{animation-delay:1.4s}
@keyframes rip{0%{stroke-width:1;opacity:.9}100%{stroke-width:14;opacity:0}}
.ln{fill:none;vector-effect:non-scaling-stroke;stroke:var(--canal);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;cursor:pointer;filter:drop-shadow(0 0 2px #fff)}
.ln.hit{stroke:transparent;stroke-width:22;filter:none}
.ln.fl{stroke:#38bdf8;stroke-width:2;stroke-dasharray:2 9;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-11}}

.dot{fill:var(--city);cursor:pointer}

.pulse{fill:none;stroke:var(--city);stroke-width:2.5;transform-box:fill-box;transform-origin:center;animation:pl 2.2s ease-out infinite;pointer-events:none}
.pulse.b{animation-delay:1.1s}
@keyframes pl{0%{transform:scale(.6);opacity:.95}100%{transform:scale(4.2);opacity:0}}
.lb{font-weight:700;font-size:13px;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round;fill:#1e293b;pointer-events:none}
.sea .lb{fill:#075985;font-style:italic}.country .lb{fill:#14532d}.canal .lb,.strait .lb{fill:#0c4a6e}.city .lb{fill:#9a3412}
.sel .lb{font-size:16px;stroke-width:5px}
.ctl{position:absolute;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px}
.ctl button{width:46px;height:46px;border-radius:12px;border:0;background:#fff;font-size:24px;font-weight:800;color:#312e81;box-shadow:0 2px 8px #0004;cursor:pointer}
.leg{display:none;position:absolute;left:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:#fffe;border-radius:14px;padding:8px 12px;font-size:clamp(12px,1.2vw,16px);display:flex;flex-wrap:wrap;gap:4px 14px;max-width:calc(100% - 20px);box-shadow:0 2px 8px #0003}
.leg i{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:5px;vertical-align:-2px;border:2px solid}
.card{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:#4c1d95;color:#fff;padding:8px 18px;border-radius:30px;font-weight:700;font-size:clamp(14px,1.6vw,20px);box-shadow:0 4px 14px #0005;display:none;max-width:90%;text-align:center}
.card.on{display:none}
footer{flex:none;background:linear-gradient(120deg,#312e81,#0e7490 70%,#059669);color:#fff;text-align:center;padding:8px 12px;font-size:clamp(12px,1.3vw,16px);font-weight:600;letter-spacing:.02em}
@media (prefers-reduced-motion:reduce){.rip,.pulse,.ln.fl{animation:none;opacity:.6}}
</style></head><body>
